[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardrails"
version = "0.2.0"
description = "LLM extraction of Brazilian fiscal documents (NF-e, CT-e, NFS-e) with deterministic guardrails against hallucinations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Luis Fillipe Damasceno" }]
keywords = ["llm", "document-ai", "extraction", "guardrails", "nf-e", "rag", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# Bounded ranges here; exact, hashed pins live in requirements.lock / requirements-dev.lock.
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.7,<3",
    "reportlab>=4.0,<6",
    "pdfplumber>=0.11,<0.12",
    "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
ml = ["torch>=2.2,<3", "numpy>=1.26,<3"]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "python-multipart>=0.0.18,<0.1",
]
mcp = ["mcp>=1.2,<3"]
gemini = ["google-genai>=1.0,<2"]
anthropic = ["anthropic>=0.40,<1"]
bedrock = ["boto3>=1.34,<2"]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=6.0,<8",
    "ruff>=0.17,<0.18",
    "mypy>=1.13,<2",
    "hypothesis>=6.100,<7",
    "httpx>=0.27,<1",
    "bandit>=1.8,<2",
    "pip-audit>=2.7,<3",
    "types-defusedxml",
    "types-reportlab",
]

[project.scripts]
docai = "docai.cli:main"

[project.urls]
Repository = "https://github.com/asoseihou/ai-guardrails"
Documentation = "https://github.com/asoseihou/ai-guardrails/tree/main/docs"
Changelog = "https://github.com/asoseihou/ai-guardrails/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docai = ["py.typed", "rag/qa_set.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "C90", "D101", "D102", "D103"]
ignore = [
    "RUF001", # ambiguous unicode characters: Portuguese text uses accents and dashes on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "PT018", "S101", "S105", "S106", "S108", "S311", "S603", "C901", "D"]
# Synthetic data and the seeded simulator use `random` on purpose (not for security).
"src/docai/synth/*" = ["S311"]
"src/docai/extract/providers/simulated.py" = ["S311"]
"src/docai/classify/*" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that train a model (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["docai"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@abstractmethod"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["docai"]
strict = true
warn_unreachable = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Optional SDKs and libraries without type information.
[[tool.mypy.overrides]]
module = ["anthropic.*", "google.*", "boto3.*", "botocore.*", "pdfplumber.*", "pdfminer.*", "mcp.*", "uvicorn.*"]
ignore_missing_imports = true

